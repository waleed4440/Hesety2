name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip and find root
        run: |
          BEST=""; BT=0
          for f in *.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -ge "$BT" ]; then BT=$t; BEST="$f"; fi
          done
          if [ -z "$BEST" ]; then echo "No zip file found"; ls -la; exit 1; fi
          echo "Using zip: $BEST"
          mkdir app_src
          unzip -q "$BEST" -d app_src
          SETTINGS=$(find app_src -name settings.gradle.kts | head -1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found"; find app_src | head -50; exit 1; fi
          ROOT=$(dirname "$SETTINGS")
          echo "ROOT=$ROOT" >> $GITHUB_ENV
      - name: Show signing fingerprints
        run: keytool -list -v -keystore "$ROOT/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Build debug APK
        run: cd "$ROOT" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EduTrack-APK
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
